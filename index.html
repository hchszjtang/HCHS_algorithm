<style>
/* Layout: a phone feed on the left, the algorithm's graph-paper notebook on the right; stacks on phones. */
:root{
  --bg:#E9EDF2; --paper:#FFFFFF; --ink:#17202B; --muted:#5A6576; --line:#D2D9E2;
  --accent:#3F33C9; --accent-ink:#FFFFFF; --rec:#E0362C; --redact:#17202B; --ok:#1F8A5B;
  --ph-body:#0A0C11; --ph-screen:#11151D; --ph-fg:#EEF1F6; --ph-muted:#8C96A6; --ph-line:#262D3A; --ph-toast:#2A3140; --ph-like:#E6406E;
  --f-display:"Times New Roman", DFKai-SB, BiauKai, "標楷體", serif;
  --f-body:"Times New Roman", DFKai-SB, BiauKai, "標楷體", serif;
  --f-mono:"Times New Roman", DFKai-SB, BiauKai, "標楷體", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1218; --paper:#171C25; --ink:#E6EAF1; --muted:#97A2B2; --line:#2A3240;
  --accent:#8E86FF; --accent-ink:#0E1218; --rec:#FF5A4F; --redact:#C9D0DB; --ok:#4CC38A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1218; --paper:#171C25; --ink:#E6EAF1; --muted:#97A2B2; --line:#2A3240;
  --accent:#8E86FF; --accent-ink:#0E1218; --rec:#FF5A4F; --redact:#C9D0DB; --ok:#4CC38A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
.page{max-width:1120px;margin:0 auto;padding-block:32px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:28px}
.mast{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px}
.mast > div{min-width:0;flex:1 1 420px}
.eyebrow{margin:0;font:500 12px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 10px;font:800 clamp(34px,6vw,60px)/1.05 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
html[lang="zh-Hant"] h1{letter-spacing:.02em;font-weight:900}
.lede{margin:0;max-width:62ch;color:var(--muted);font-size:17px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:3px;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stage{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}.phone{max-width:400px;width:100%;margin:0 auto}}

/* Phone: a deliberately dark app screen in both themes */
.phone{background:var(--ph-body);border-radius:38px;padding:12px;box-shadow:0 18px 40px -18px rgba(10,12,20,.55)}
.screen{background:var(--ph-screen);color:var(--ph-fg);border-radius:28px;min-height:660px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.feedbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--ph-line);font:500 12px var(--f-mono);color:var(--ph-muted)}
.feedbar .app{font:800 18px var(--f-display);color:var(--ph-fg);letter-spacing:-.01em}
.feedbar button{font:500 11px var(--f-mono);color:var(--ph-fg);background:transparent;border:1px solid var(--ph-line);border-radius:999px;padding:4px 10px;cursor:pointer}
.feedbar button:disabled{opacity:.4;cursor:default}
.post{display:flex;flex-direction:column;gap:10px;padding:12px 14px 0}
.post-head{display:flex;align-items:center;gap:8px;font-size:14px}
.avatar{width:28px;height:28px;border-radius:50%;flex:none;border:2px solid var(--ph-screen);box-shadow:0 0 0 1.5px var(--ph-line)}
.sugg{margin-left:auto;font:400 11px var(--f-mono);color:var(--ph-muted)}
.art{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:14px;overflow:hidden;display:flex;align-items:flex-end;padding:18px;background:var(--c);}
.art-title{font:800 clamp(24px,7vw,32px)/1.12 var(--f-display);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.9);text-wrap:balance;position:relative;z-index:2;}
.prog{position:absolute;top:10px;left:12px;right:12px;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#fff}
.prog.run i{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--ph-fg);border:1px solid var(--ph-line);border-radius:999px;padding:7px 12px;font:500 13px var(--f-body);cursor:pointer}
.act svg{width:18px;height:18px}
.act[aria-pressed="true"]{background:var(--ph-like);border-color:var(--ph-like);color:#fff}
.act.ni{margin-left:auto;border-style:dashed}
.likes{margin:0;font:600 13px var(--f-body)}
.cap{margin:0;font-size:13px;color:var(--ph-muted)}
.cap b{color:var(--ph-fg)}
.next{margin:auto 14px 14px;background:var(--ph-fg);color:var(--ph-screen);border:0;border-radius:14px;padding:13px;font:600 15px var(--f-body);cursor:pointer}
.ph-msg{flex:1;display:flex;flex-direction:column;gap:14px;padding:26px 22px 22px}
.ph-msg h2{margin:0;font:800 30px/1.15 var(--f-display);text-wrap:balance}
.ph-msg p{margin:0;color:var(--ph-muted);font-size:15px}
.ph-msg p b{color:var(--ph-fg)}
.ph-msg ul{margin:0;padding-left:18px;color:var(--ph-muted);font-size:14px;display:grid;gap:6px}
.ph-msg ul b{color:var(--ph-fg)}
.ph-btns{margin-top:auto;display:grid;gap:10px}
.btn{border:0;border-radius:14px;padding:13px 14px;font:600 15px var(--f-body);cursor:pointer;background:var(--ph-fg);color:var(--ph-screen)}
.btn.ghost{background:transparent;color:var(--ph-fg);border:1px solid var(--ph-line)}
.toast{position:absolute;left:14px;right:14px;bottom:76px;background:var(--ph-toast);color:var(--ph-fg);font-size:13px;padding:10px 12px;border-radius:10px}
.kbd{font:400 12px var(--f-mono);color:var(--ph-muted)}

/* Notebook */
.notebook{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:24px clamp(16px,3vw,32px) 28px;min-width:0;
  background-image:linear-gradient(color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px);
  background-size:22px 22px;display:grid;gap:22px}
.nb-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.nb-head h2{margin:0;font:800 26px/1.15 var(--f-display);letter-spacing:-.01em}
.tag{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);background:var(--paper);padding:3px 8px;border-radius:4px}
.rec{display:inline-flex;align-items:center;gap:6px;color:var(--rec);border-color:color-mix(in srgb,var(--rec) 40%,var(--line))}
.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rec);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.nb p{margin:0}
.sub{margin:0 0 10px;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big{font:800 56px/1 var(--f-display);font-variant-numeric:tabular-nums}
.sigrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.redact{display:grid;gap:8px}
.redact div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.redact span{height:12px;background:var(--redact);border-radius:2px}
.redact i{height:12px;background:var(--redact);opacity:.85;border-radius:2px;transition:width .5s ease}
.verdict{font:600 clamp(20px,2.6vw,26px)/1.35 var(--f-body);text-wrap:balance}
.verdict b{font-family:var(--f-display);font-weight:800}
.strip{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px}
.strip.r2{grid-template-columns:repeat(20,minmax(0,1fr))}
.strip span{aspect-ratio:1/2;border-radius:2px;max-width:100%}
.strip span.ni{outline:2px solid var(--ink);outline-offset:-2px;opacity:.45}
.strip-labels{display:flex;justify-content:space-between;gap:8px;font:400 12px var(--f-mono);color:var(--muted);margin-top:6px}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.compare div{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:10px 12px}
.compare b{display:block;font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.compare small{color:var(--muted);font-size:13px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:118px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:2px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:2px;transition:width .5s ease}
.bar .pct{font:500 12px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.log{margin:0;padding:0;list-style:none;display:grid;gap:6px;font:400 13px/1.45 var(--f-mono)}
.log li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.log li span:first-child{min-width:0}
.log li span:last-child{white-space:nowrap;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 14px;color:var(--ink)}
.note p+p{margin-top:8px}
.goal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.goal div{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:12px}
.goal b{font:800 30px var(--f-display);font-variant-numeric:tabular-nums}
.goal small{color:var(--muted)}
.goal .ok{color:var(--ok)}.goal .no{color:var(--rec)}
.discuss{border-top:2px solid var(--ink);padding-top:16px}
.discuss ol{margin:0;padding-left:22px;display:grid;gap:8px}
.nb-btns{display:flex;flex-wrap:wrap;gap:10px}
.nb-btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font:600 14px var(--f-body);cursor:pointer}
.nb-btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
footer{font-size:13px;color:var(--muted);max-width:75ch}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:480px){.bar{grid-template-columns:90px minmax(0,1fr) 40px}.redact div{grid-template-columns:80px minmax(0,1fr)}.compare,.goal{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.prog.run i{animation:none;width:100%}.rec::before{animation:none}.bar .track i,.redact i{transition:none}}
</style>
</head>

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pct=v=>Math.round(v*100)+"%";

function fresh(){
  S={
    round:0,
    n:0,
    w:Object.fromEntries(KEYS.map(k=>[k,0])),
    hist:[],
    cur:null,
    pools:{},
    resetUsed:false,
    globalSeen: new Set() // 👈 跨類別的全域已看過紀錄，徹底防止重複出現
  };
}

function draw(cat){
  if(!POSTS[cat] || !Array.isArray(POSTS[cat])){
    console.error(`Missing or invalid category posts for: ${cat}`);
    return ["system", 0, "Default Title", "Default Description", "預設標題", "預設內容", "https://picsum.photos/id/101/600/800"];
  }

  // 1. 找出該類別下所有尚未全域出現過的貼文索引
  let availableIndices = POSTS[cat]
    .map((_, i) => i)
    .filter(i => !S.globalSeen.has(POSTS[cat][i][2]));

  // 2. 如果該類別貼文全看完，重置該類別的全域紀錄讓它可重新循環
  if (availableIndices.length === 0) {
    POSTS[cat].forEach(p => S.globalSeen.delete(p[2]));
    availableIndices = POSTS[cat].map((_, i) => i);
  }

  // 3. 隨機選取未看過的貼文
  const randomIndex = Math.floor(Math.random() * availableIndices.length);
  const chosenIndex = availableIndices[randomIndex];
  const selectedPost = POSTS[cat][chosenIndex];

  // 4. 登記為全域已出現過
  S.globalSeen.add(selectedPost[2]);

  return selectedPost;
}

function odds(){const testing=S.round===1&&S.n<5;const raw=KEYS.map(k=>testing?1:Math.exp(.55*S.w[k]+BOOST[k]));const sum=raw.reduce((a,b)=>a+b,0);return Object.fromEntries(KEYS.map((k,i)=>[k,raw[i]/sum]))}
function pick(){const o=odds();let r=Math.random();for(const k of KEYS){r-=o[k];if(r<=0)return k}return KEYS[KEYS.length-1]}
const roundHist=r=>S.hist.filter(h=>h.round===r);

function nextPost(){const cat=pick();S.cur={cat,post:draw(cat),start:performance.now(),hidden:0,liked:false,replays:0}}

function renderPost(){
  showScreenOnly();
  if(!S || !S.cur) return;
  const c=S.cur,p=c.post,col=CATS[c.cat].color,total=S.round===1?30:20,r2=S.round===2;
  screenEl.innerHTML=`<div class="feedbar"><span class="app">feed</span><span>${t("postN")(S.n+1,total)}</span>${r2?`<button id="reset" ${S.resetUsed?"disabled":""}>${t("reset")}</button>`:""}</div>

  <div class="art" id="art-img" style="--c:${col}; cursor:pointer; user-select:none; touch-action:manipulation;">
    <img src="${p[6]}" alt="Post Image" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;z-index:1;" />
    <div class="prog run" id="prog" style="position:relative;z-index:2;"><i></i></div>
    <span class="art-title" style="position:relative;z-index:2;">${pTitle(p)}</span>
  </div>
  <div class="actions"><button class="act" id="like" aria-pressed="${c.liked}">${ICON.like}${t("like")}</button><button class="act" id="replay">${ICON.replay}${t("replay")}</button>${r2?`<button class="act ni" id="ni">${ICON.ni}${t("ni")}</button>`:""}</div>
  <p class="likes" id="likes">${t("likes")(p[1]+(c.liked?1:0))}</p><p class="cap"><b>${p[0]}</b> ${pCap(p)}</p></article>
  <button class="next" id="next">${t("next")}</button>`;
  
  $("#like").onclick = doLike;
  $("#replay").onclick = doReplay;
  $("#next").onclick = () => advance(false);
  
  let lastTapTime = 0;
  const artElement = $("#art-img");
  
  artElement.onpointerup = (e) => {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTapTime;
    if (tapLength < 350 && tapLength > 0) {
      e.preventDefault();
      if (S.cur && !S.cur.liked) {
        doLike();
      }
    }
    lastTapTime = currentTime;
  };

  if(r2){
    $("#ni").onclick = () => advance(true);
    $("#reset").onclick = doReset;
  }
}

function doLike(){if(!S || !S.cur) return; const c=S.cur;c.liked=!c.liked;const lBtn=$("#like"), lks=$("#likes");if(lBtn)lBtn.setAttribute("aria-pressed",c.liked);if(lks)lks.textContent=t("likes")(c.post[1]+(c.liked?1:0));curNb()}
function doReplay(){if(!S || !S.cur) return; S.cur.replays++;const p=$("#prog");if(p){p.classList.remove("run");void p.offsetWidth;p.classList.add("run");}curNb()}
function doReset(){S.resetUsed=true;KEYS.forEach(k=>S.w[k]=0);const rBtn=$("#reset");if(rBtn)rBtn.disabled=true;toast(t("toastReset"));curNb()}
function toast(msg){let el=screenEl.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");screenEl.appendChild(el)}el.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3200)}

function advance(ni){
  if(!S || !S.cur) return;
  const c=S.cur;const dwell=Math.min(12,Math.max(0,(performance.now()-c.start-c.hidden)/1000));
  let d;if(ni)d=-4;else{d=dwell<1?-.4:Math.min(dwell-1,8)*.45;if(c.liked)d+=1.6;d+=Math.min(c.replays,3)*1.2}
  S.w[c.cat]=clamp(S.w[c.cat]+d,-6,12);
  S.hist.push({round:S.round,cat:c.cat,post:c.post,dwell,liked:c.liked,replays:c.replays,delta:d,ni});
  S.n++;S.cur=null;
  if(S.round===1&&S.n>=30)return endR1();
  if(S.round===2&&S.n>=20)return endR2();
  nextPost();renderPost();curNb();
}

}

function goalState(){const l=roundHist(2).slice(-10);const ty=types(l),c=comps(l);return {ty,c,win:l.length>=10&&ty>=5&&c<=3}}
function goalHTML(g){return `<div class="goal"><div><small>${t("typesL10")}</small><br><b class="${g.ty>=5?"ok":"no"}">${g.ty}</b> <small>${t("need5")}</small></div><div><small>${t("compL10")}</small><br><b class="${g.c<=3?"ok":"no"}">${g.c}</b> <small>${t("max3")}</small></div></div>`}

function renderEscapeLive(){
  showSplitStage();
  const h=roundHist(2);
  nb.innerHTML=`<div class="nb-head"><h2>${t("liveTitle")}</h2><span class="tag">${t("live")}</span></div>
  <p>${t("liveP")}</p>${goalHTML(goalState())}
  <div><p class="sub">${t("soFar")}</p>${h.length?stripHTML(h,"r2"):`<p style="color:var(--muted)">${t("nothing")}</p>`}</div>
  <div><p class="sub">${t("odds")}</p>${barsHTML(odds())}</div>${legendHTML()}`;
}

function renderEscapeResult(){
  showNotebookOnly();
  const g=goalState(),h=roundHist(2),o=odds();
  const niN=h.filter(x=>x.ni).length,pc=h.filter(x=>!x.ni&&CATS[x.cat].comp&&x.dwell>=1).length;
  const co=KEYS.filter(k=>CATS[k].comp).reduce((a,k)=>a+o[k],0);
  nb.innerHTML=`<div class="nb-head"><h2>${g.win?t("winT"):t("loseT")}</h2><span class="tag">${t("result")}</span></div>
  ${goalHTML(g)}
  <div><p class="sub">${t("your20")}</p>${stripHTML(h,"r2")}</div>
  <div><p class="sub">${t("did")}</p><ul class="log"><li><span>${t("niCount")}</span><span>${niN}</span></li><li><span>${t("pausedComp")}</span><span>${pc}</span></li><li><span>${t("usedReset")}</span><span>${S.resetUsed?t("yes"):t("no")}</span></li><li><span>${t("compOdds")}</span><span>${pct(co)}</span></li></ul></div>
  <div class="note">${pc?`<p>${t("pausedNote")(pc)}</p>`:""}<p>${S.resetUsed?t("resetNote"):t("noResetNote")}</p><p>${t("catherine")}</p></div>
  ${legendHTML()}
  <div class="nb-btns"><button class="nb-btn" id="nbRetry">${t("retry")}</button><button class="nb-btn ghost" id="nbStart">${t("startOver")}</button></div>
  ${discussHTML()}`;
  $("#nbRetry").onclick=()=>show(renderR2Intro);$("#nbStart").onclick=resetAll;
}

/* ---------- Language ---------- */
function applyStatic(){
  document.documentElement.lang=L==="zh"?"zh-Hant":"en";
  ["eyebrow","h1","lede","foot"].forEach(id=>$("#"+id).textContent=t(id));
  $("#lang-en").setAttribute("aria-pressed",L==="en");$("#lang-zh").setAttribute("aria-pressed",L==="zh");
}
function setLang(l){
  if(l===L)return;L=l;try{localStorage.setItem("feed-lang",l)}catch(e){}
  applyStatic();if(curPhone)curPhone();if(curNb)curNb();
}
$("#lang-en").onclick=()=>setLang("en");$("#lang-zh").onclick=()=>setLang("zh");

document.addEventListener("keydown",e=>{
  if(!S||!S.cur||e.target.closest("input,textarea,.lang"))return;
  const k=e.key.toLowerCase();
  if(k==="arrowdown"||k===" "){e.preventDefault();advance(false)}
  else if(k==="l")doLike();else if(k==="r")doReplay();else if(k==="n"&&S.round===2)advance(true);
});
applyStatic();resetAll();
</script>
</body>
