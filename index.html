.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.kbd{font:400 12px var(--f-mono);color:var(--ph-muted)}

.notebook{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:24px clamp(16px,3vw,32px) 28px;min-width:0;

.big{font:800 56px/1 var(--f-display);font-variant-numeric:tabular-nums}

footer{font-size:13px;color:var(--muted);max-width:75ch}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

@media (prefers-reduced-motion:reduce){.prog.run i{animation:none;width:100%}.rec::before{animation:none}.bar .track i,.redact i{transition:none}}
</style>
</head>

  discuss:["Hành động nào của bạn được thuật toán tính là quan tâm? Điều gì khiến bạn bất ngờ?","Bốn loại được ưu tiên trước khi bạn làm gì. Tại sao nền tảng lại thiết kế như vậy?","Ở Vòng 2, cách nào hiệu quả? Nội dung có quay lại sau khi bạn cố xóa không?","Trong Utah Insight, Catherine đã hủy theo dõi và chặn tài khoản nhưng vẫn nhận video độc hại. Trò chơi này giải thích điều đó thế nào?","Thiết kế một 'dây an toàn': tính năng nền tảng có thể thêm vào để bảo vệ thanh thiếu niên mà không cần cấm ứng dụng."]
}};

let L="en";
try{const saved=localStorage.getItem("feed-lang");if(saved==="en"||saved==="zh"||saved==="vi")L=saved;else if((navigator.language||"").toLowerCase().startsWith("zh"))L="zh";else if((navigator.language||"").toLowerCase().startsWith("vi"))L="vi"}catch(e){if((navigator.language||"").toLowerCase().startsWith("zh"))L="zh";else if((navigator.language||"").toLowerCase().startsWith("vi"))L="vi"}
const t=k=>T[L][k];
const catLabel=k=>CATS[k][L][0],catShort=k=>CATS[k][L][1];
const pTitle=p=>L==="zh"?p[4]:L==="vi"?p[6]:p[2],pCap=p=>L==="zh"?p[5]:L==="vi"?p[7]:p[3];

const $=s=>document.querySelector(s);
const screenEl=$("#screen"),nb=$("#notebook"),stageEl=$("#stage"),phoneContainerEl=$("#phone-container");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pct=v=>Math.round(v*100)+"%";
let S,hiddenAt=null,toastTimer=null,curPhone=null,curNb=null;

function fresh(){
  S={
    round:0,
    n:0,
    w:Object.fromEntries(KEYS.map(k=>[k,0])),
    hist:[],
    cur:null,
    resetUsed:false,
    globalSeen: new Set()
  };
}

function draw(cat){
  if(!POSTS[cat] || !Array.isArray(POSTS[cat])){
    return ["system", 0, "Default Title", "Default Description", "預設標題", "預設內容", "Tiêu đề", "Mô tả", "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600"];
  }
  let availableIndices = POSTS[cat].map((_, i) => i).filter(i => !S.globalSeen.has(POSTS[cat][i][2]));
  if (availableIndices.length === 0) {
    POSTS[cat].forEach(p => S.globalSeen.delete(p[2]));
    availableIndices = POSTS[cat].map((_, i) => i);
  }
  const randomIndex = Math.floor(Math.random() * availableIndices.length);
  const chosenIndex = availableIndices[randomIndex];
  const selectedPost = POSTS[cat][chosenIndex];
  S.globalSeen.add(selectedPost[2]);
  return selectedPost;
}

function odds(){const testing=S.round===1&&S.n<5;const raw=KEYS.map(k=>testing?1:Math.exp(.55*S.w[k]+BOOST[k]));const sum=raw.reduce((a,b)=>a+b,0);return Object.fromEntries(KEYS.map((k,i)=>[k,raw[i]/sum]))}
function pick(){const o=odds();let r=Math.random();for(const k of KEYS){r-=o[k];if(r<=0)return k}return KEYS[KEYS.length-1]}
const roundHist=r=>S.hist.filter(h=>h.round===r);
document.addEventListener("visibilitychange",()=>{if(!S||!S.cur)return;if(document.hidden)hiddenAt=performance.now();else if(hiddenAt){S.cur.hidden+=performance.now()-hiddenAt;hiddenAt=null}});

const ICON={
  like:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3.2 4.5 6.8 4.5c2 0 3.4 1.1 4.2 2.4.8-1.3 2.2-2.4 4.2-2.4 3.6 0 5.6 3.7 4 6.9C19 15.6 12 20 12 20z"/></svg>',
  replay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
  ni:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg>'
};

function showScreenOnly() {
  stageEl.style.gridTemplateColumns = "minmax(300px, 400px)";
  stageEl.style.justifyContent = "center";
  phoneContainerEl.style.display = "block";
  nb.style.display = "none";
}

function showSplitStage() {
  stageEl.style.gridTemplateColumns = "minmax(300px,380px) minmax(0,1fr)";
  stageEl.style.justifyContent = "stretch";
  phoneContainerEl.style.display = "block";
  nb.style.display = "grid";
}

function showNotebookOnly() {
  stageEl.style.gridTemplateColumns = "minmax(0,1fr)";
  phoneContainerEl.style.display = "none";
  nb.style.display = "grid";
}

function show(phone,book){
  if(phone){curPhone=phone;phone()}
  if(book){curNb=book;book()}
}

function renderIntro(){
  showScreenOnly();
  screenEl.innerHTML=`<div class="feedbar"><span class="app">feed</span><span>${t("r1")}</span></div>
  <div class="ph-msg"><h2>${t("introH")}</h2><p>${t("introP")}</p><ul>${t("introL")}</ul><p>${t("introP2")}</p>
  <div class="ph-btns"><button class="btn" id="go">${t("start")}</button><span class="kbd">${t("keys")}</span></div></div>`;
  $("#go").onclick=startR1;
}

function nextPost(){const cat=pick();S.cur={cat,post:draw(cat),start:performance.now(),hidden:0,liked:false,replays:0}}

function renderPost(){
  showScreenOnly();
  if(!S || !S.cur) return;
  const c=S.cur,p=c.post,col=CATS[c.cat].color,total=S.round===1?30:20,r2=S.round===2;
  const imgUrl = p[8] || p[6];
  screenEl.innerHTML=`<div class="feedbar"><span class="app">feed</span><span>${t("postN")(S.n+1,total)}</span>${r2?`<button id="reset" ${S.resetUsed?"disabled":""}>${t("reset")}</button>`:""}</div>
  <article class="post"><div class="post-head"><span class="avatar" style="background:${col}"></span><b>@${p[0]}</b><span class="sugg">${t("sugg")}</span></div>
  <div class="art" id="art-img" style="--c:${col}; cursor:pointer; user-select:none; touch-action:manipulation;">
    <img src="${imgUrl}" alt="Post Image" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;z-index:1;" />
    <div class="prog run" id="prog" style="position:relative;z-index:2;"><i></i></div>
    <span class="art-title" style="position:relative;z-index:2;">${pTitle(p)}</span>
  </div>
  <div class="actions"><button class="act" id="like" aria-pressed="${c.liked}">${ICON.like}${t("like")}</button><button class="act" id="replay">${ICON.replay}${t("replay")}</button>${r2?`<button class="act ni" id="ni">${ICON.ni}${t("ni")}</button>`:""}</div>
  <p class="likes" id="likes">${t("likes")(p[1]+(c.liked?1:0))}</p><p class="cap"><b>${p[0]}</b> ${pCap(p)}</p></article>
  <button class="next" id="next">${t("next")}</button>`;
  
  $("#like").onclick = doLike;
  $("#replay").onclick = doReplay;
  $("#next").onclick = () => advance(false);
  
  let lastTapTime = 0;
  const artElement = $("#art-img");
  artElement.onpointerup = (e) => {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTapTime;
    if (tapLength < 350 && tapLength > 0) {
      e.preventDefault();
      if (S.cur && !S.cur.liked) doLike();
    }
    lastTapTime = currentTime;
  };

  if(r2){
    $("#ni").onclick = () => advance(true);
    $("#reset").onclick = doReset;
  }
}

function doLike(){if(!S || !S.cur) return; const c=S.cur;c.liked=!c.liked;const lBtn=$("#like"), lks=$("#likes");if(lBtn)lBtn.setAttribute("aria-pressed",c.liked);if(lks)lks.textContent=t("likes")(c.post[1]+(c.liked?1:0));curNb()}
function doReplay(){if(!S || !S.cur) return; S.cur.replays++;const p=$("#prog");if(p){p.classList.remove("run");void p.offsetWidth;p.classList.add("run");}curNb()}
function doReset(){S.resetUsed=true;KEYS.forEach(k=>S.w[k]=0);const rBtn=$("#reset");if(rBtn)rBtn.disabled=true;toast(t("toastReset"));curNb()}
function toast(msg){let el=screenEl.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");screenEl.appendChild(el)}el.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3200)}

function advance(ni){
  if(!S || !S.cur) return;
  const c=S.cur;const dwell=Math.min(12,Math.max(0,(performance.now()-c.start-c.hidden)/1000));
  let d;if(ni)d=-4;else{d=dwell<1?-.4:Math.min(dwell-1,8)*.45;if(c.liked)d+=1.6;d+=Math.min(c.replays,3)*1.2}
  S.w[c.cat]=clamp(S.w[c.cat]+d,-6,12);
  S.hist.push({round:S.round,cat:c.cat,post:c.post,dwell,liked:c.liked,replays:c.replays,delta:d,ni});
  S.n++;S.cur=null;
  if(S.round===1&&S.n>=30)return endR1();
  if(S.round===2&&S.n>=20)return endR2();
  nextPost();renderPost();curNb();
}

function startR1(){fresh();S.round=1;nextPost();show(renderPost,renderLocked)}

function renderR1End(){
  showNotebookOnly();
  screenEl.innerHTML=`<div class="feedbar"><span class="app">feed</span><span>${t("r1done")}</span></div>
  <div class="ph-msg"><h2>${t("r1doneH")}</h2><p>${t("r1doneP")}</p>
  <div class="ph-btns"><button class="btn" id="r2">${t("toR2")}</button><button class="btn ghost" id="again">${t("againR1")}</button></div></div>`;
  $("#r2").onclick=()=>show(renderR2Intro);$("#again").onclick=startR1;
}

function endR1(){show(renderR1End,renderReveal);if(window.matchMedia("(max-width:860px)").matches)nb.scrollIntoView({behavior:"smooth",block:"start"})}

function renderR2Intro(){
  showScreenOnly();
  screenEl.innerHTML=`<div class="feedbar"><span class="app">feed</span><span>${t("r2")}</span></div>
  <div class="ph-msg"><h2>${t("r2H")}</h2><p>${t("r2P")}</p><ul>${t("r2L")}</ul><p>${t("r2P2")}</p>
  <div class="ph-btns"><button class="btn" id="stuck">${t("stuck")}</button><button class="btn ghost" id="mine">${t("mine")}</button></div></div>`;
  $("#stuck").onclick=()=>startR2(true);$("#mine").onclick=()=>startR2(false);
}

function startR2(stuck){
  if(!roundHist(1).length&&!stuck){stuck=true}
  S.hist=roundHist(1);S.round=2;S.n=0;S.resetUsed=false;
  if(stuck)S.w={...STUCK};
  nextPost();show(renderPost,renderEscapeLive);
}

function renderR2End(){
  showNotebookOnly();
  const g = goalState();
  screenEl.innerHTML=`<div class="feedbar"><span class="app">feed</span><span>${t("r2done")}</span></div>
  <div class="ph-msg"><h2>${g.win?t("winH"):t("loseH")}</h2><p>${g.win?t("winP"):t("loseP")}</p>
  <div class="ph-btns"><button class="btn" id="retry">${t("retry")}</button><button class="btn ghost" id="restart">${t("restart")}</button></div></div>`;
  $("#retry").onclick=()=>show(renderR2Intro);$("#restart").onclick=resetAll;
}

function endR2(){show(renderR2End,renderEscapeResult)}
function resetAll(){fresh();show(renderIntro,renderLocked)}

function renderLocked(){ nb.style.display = "none"; }

const esc=s=>s.replace(/"/g,"&quot;");
const stripHTML=(list,cls)=>`<div class="strip ${cls||""}">${list.map(h=>`<span class="${h.ni?"ni":""}" style="background:${CATS[h.cat].color}" title="${esc(catShort(h.cat)+": "+pTitle(h.post))}"></span>`).join("")}</div>`;
const barsHTML=o=>`<div class="bars">${KEYS.slice().sort((a,b)=>o[b]-o[a]).map(k=>`<div class="bar"><span>${catShort(k)}</span><span class="track"><i style="width:${o[k]*100}%;background:${CATS[k].color}"></i></span><span class="pct">${pct(o[k])}</span></div>`).join("")}</div>`;
const legendHTML=()=>`<div class="legend"><span><i style="background:${CATS.look.color}"></i><i style="background:${CATS.body.color}"></i>${t("warm")}</span><span><i style="background:${CATS.friends.color}"></i><i style="background:${CATS.hobby.color}"></i>${t("cool")}</span></div>`;
const discussHTML=()=>`<section class="discuss"><p class="sub">${t("discussT")}</p><ol>${t("discuss").map(q=>`<li>${q}</li>`).join("")}</ol></section>`;
const types=l=>new Set(l.map(h=>h.cat)).size, comps=l=>l.filter(h=>CATS[h.cat].comp).length;

function renderReveal(){
  showNotebookOnly();
  const h=roundHist(1),o=odds(),top=KEYS.slice().sort((a,b)=>o[b]-o[a])[0];
  const first=h.slice(0,10),last=h.slice(-10);
  const strong=h.map((x,i)=>({...x,i:i+1})).filter(x=>x.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,5);
  const total=h.reduce((a,x)=>a+x.dwell,0),likes=h.filter(x=>x.liked).length,reps=h.reduce((a,x)=>a+x.replays,0),skips=h.filter(x=>x.dwell<1).length;
  const line=x=>[`#${x.i} ${pTitle(x.post)}`,t("paused")(x.dwell.toFixed(1)),x.liked?t("liked"):"",x.replays?t("replayed")(x.replays):""].filter(Boolean).join(" · ");
  nb.innerHTML=`<div class="nb-head"><h2>${t("revealTitle")}</h2><span class="tag">${t("unlocked")}</span></div>
  <p class="verdict">${t("verdict")(catLabel(top),CATS[top].color,pct(o[top]))}</p>
  <div><p class="sub">${t("your30")}</p>${stripHTML(h)}<div class="strip-labels"><span>${t("post1")}</span><span>${t("testing")}</span><span>30</span></div>
  <div class="compare"><div><small>${t("first10")}</small><b>${t("typesN")(types(first))}</b><small>${t("compN")(comps(first))}</small></div><div><small>${t("last10")}</small><b>${t("typesN")(types(last))}</b><small>${t("compN")(comps(last))}</small></div></div></div>
  <div><p class="sub">${t("odds")}</p>${barsHTML(o)}</div>
  <div><p class="sub">${t("strongest")}</p>${strong.length?`<ul class="log">${strong.map(x=>`<li><span>${line(x)}</span><span style="color:${CATS[x.cat].color}">+${x.delta.toFixed(1)} ${catShort(x.cat)}</span></li>`).join("")}</ul>`:`<p>${t("none")}</p>`}</div>
  <div><p class="sub">${t("receipt")}</p><ul class="log"><li><span>${t("timeW")}</span><span>${t("sec")(total.toFixed(0))}</span></li><li><span>${t("likesW")}</span><span>${likes}</span></li><li><span>${t("replaysW")}</span><span>${reps}</span></li><li><span>${t("skips")}</span><span>${skips}</span></li><li><span>${t("typed")}</span><span>0</span></li></ul></div>
  <div class="note"><p>${t("note1")}</p><p>${t("note2")}</p></div>
  ${legendHTML()}
  <div class="nb-btns"><button class="nb-btn" id="nbR2">${t("toR2")}</button><button class="nb-btn ghost" id="nbAgain">${t("againR1")}</button></div>
  ${discussHTML()}`;
  $("#nbR2").onclick=()=>show(renderR2Intro);$("#nbAgain").onclick=startR1;
}

function goalState(){const l=roundHist(2).slice(-10);const ty=types(l),c=comps(l);return {ty,c,win:l.length>=10&&ty>=5&&c<=3}}
function goalHTML(g){return `<div class="goal"><div><small>${t("typesL10")}</small><br><b class="${g.ty>=5?"ok":"no"}">${g.ty}</b> <small>${t("need5")}</small></div><div><small>${t("compL10")}</small><br><b class="${g.c<=3?"ok":"no"}">${g.c}</b> <small>${t("max3")}</small></div></div>`}

function renderEscapeLive(){
  showSplitStage();
  const h=roundHist(2);
  nb.innerHTML=`<div class="nb-head"><h2>${t("liveTitle")}</h2><span class="tag">${t("live")}</span></div>
  <p>${t("liveP")}</p>${goalHTML(goalState())}
  <div><p class="sub">${t("soFar")}</p>${h.length?stripHTML(h,"r2"):`<p style="color:var(--muted)">${t("nothing")}</p>`}</div>
  <div><p class="sub">${t("odds")}</p>${barsHTML(odds())}</div>${legendHTML()}`;
}

function renderEscapeResult(){
  showNotebookOnly();
  const g=goalState(),h=roundHist(2),o=odds();
  const niN=h.filter(x=>x.ni).length,pc=h.filter(x=>!x.ni&&CATS[x.cat].comp&&x.dwell>=1).length;
  const co=KEYS.filter(k=>CATS[k].comp).reduce((a,k)=>a+o[k],0);
  nb.innerHTML=`<div class="nb-head"><h2>${g.win?t("winT"):t("loseT")}</h2><span class="tag">${t("result")}</span></div>
  ${goalHTML(g)}
  <div><p class="sub">${t("your20")}</p>${stripHTML(h,"r2")}</div>
  <div><p class="sub">${t("did")}</p><ul class="log"><li><span>${t("niCount")}</span><span>${niN}</span></li><li><span>${t("pausedComp")}</span><span>${pc}</span></li><li><span>${t("usedReset")}</span><span>${S.resetUsed?t("yes"):t("no")}</span></li><li><span>${t("compOdds")}</span><span>${pct(co)}</span></li></ul></div>
  <div class="note">${pc?`<p>${t("pausedNote")(pc)}</p>`:""}<p>${S.resetUsed?t("resetNote"):t("noResetNote")}</p><p>${t("catherine")}</p></div>
  ${legendHTML()}
  <div class="nb-btns"><button class="nb-btn" id="nbRetry">${t("retry")}</button><button class="nb-btn ghost" id="nbStart">${t("startOver")}</button></div>
  ${discussHTML()}`;
  $("#nbRetry").onclick=()=>show(renderR2Intro);$("#nbStart").onclick=resetAll;
}

function applyStatic(){
  document.documentElement.lang=L==="zh"?"zh-Hant":L==="vi"?"vi":"en";
  ["eyebrow","h1","lede","foot"].forEach(id=>$("#"+id).textContent=t(id));
  $("#lang-en").setAttribute("aria-pressed",L==="en");
  $("#lang-zh").setAttribute("aria-pressed",L==="zh");
  $("#lang-vi").setAttribute("aria-pressed",L==="vi");
}
function setLang(l){
  if(l===L)return;L=l;try{localStorage.setItem("feed-lang",l)}catch(e){}
  applyStatic();if(curPhone)curPhone();if(curNb)curNb();
}
$("#lang-en").onclick=()=>setLang("en");
$("#lang-zh.onclick")||($("#lang-zh").onclick=()=>setLang("zh"));
$("#lang-vi").onclick=()=>setLang("vi");

document.addEventListener("keydown",e=>{
  if(!S||!S.cur||e.target.closest("input,textarea,.lang"))return;
  const k=e.key.toLowerCase();
  if(k==="arrowdown"||k===" "){e.preventDefault();advance(false)}
  else if(k==="l")doLike();else if(k==="r")doReplay();else if(k==="n"&&S.round===2)advance(true);
});
applyStatic();resetAll();
</script>
</body>
</html>
